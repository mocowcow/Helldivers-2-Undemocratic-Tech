name: Release on tag

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: cmd
        run: build.bat

      - name: Compress EXE
        run: Compress-Archive -LiteralPath "dist/HD2 Undemocratic Tech.exe" -DestinationPath "dist/HD2-Undemocratic-Tech.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" "dist/HD2-Undemocratic-Tech.zip" --title "$env:RELEASE_TAG" --generate-notes
